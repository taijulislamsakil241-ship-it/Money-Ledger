/* ---------- calculations ---------- */
function bankStats(name){
  const cfg=D.settings.banks.find(b=>b.name===name);const open=+(cfg&&cfg.open)||0;
  const dep=sum(S.bank.filter(x=>x.bank===name&&x.type===DEP).map(x=>x.amount));
  const wd=sum(S.bank.filter(x=>x.bank===name&&x.type===WD).map(x=>x.amount));
  const spent=sum(S.exp.filter(e=>e.method===name).map(e=>e.amount));
  return {name,open,dep,wd,spent,bal:open+dep-wd-spent};
}
const totalBalance=()=>sum(bankNames().map(n=>bankStats(n).bal));
const isIncomeDesc=d=>INCOME_WORDS.some(w=>String(d||'').includes(w));
const isInc=x=>x.type===DEP&&(x.income||isIncomeDesc(x.desc));
function monthStats(key){
  const ex=S.exp.filter(e=>mOf(e.date)===key);
  const by={};ex.forEach(e=>{by[e.cat]=(by[e.cat]||0)+(+e.amount||0)});
  const total=sum(ex.map(e=>e.amount));
  const man=D.settings.income[key]||{};
  const auto=sum(S.bank.filter(x=>mOf(x.date)===key&&isInc(x)).map(x=>x.amount));
  const income=(+man.salary||0)+(+man.other||0)+auto;
  return {key,by,total,income,net:income-total,count:ex.length,auto};
}
const firstKey=()=>{const a=[...S.exp.map(e=>mOf(e.date)),...S.bank.map(x=>mOf(x.date))].sort();return a[0]||'0000-00'};
function balanceAt(key){
  const open=sum(D.settings.banks.map(b=>b.open));
  const dep=sum(S.bank.filter(x=>mOf(x.date)<=key&&x.type===DEP).map(x=>x.amount));
  const wd=sum(S.bank.filter(x=>mOf(x.date)<=key&&x.type===WD).map(x=>x.amount));
  const sp=sum(S.exp.filter(e=>mOf(e.date)<=key).map(e=>e.amount));
  return open+dep-wd-sp;
}

    try{const r=o.onSave(new FormData(form));if(r){const er=$('sheetErr');er.textContent=r;er.hidden=false;return}closeSheet()}
    catch(e){const er=$('sheetErr');er.textContent=t('sFail',(e&&e.message)||t('retry'));er.hidden=false}};

function restoreFile(file){

      d.settings.income=d.settings.income||{};d.settings.currency=d.settings.currency||'BDT';

/* ---------- Excel ---------- */
const isoOf=v=>{
  if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()+12*3600e3).toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000)return new Date(Math.round((v-25569)*86400e3)).toISOString().slice(0,10);
  if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
  return null;
};
async function importXlsx(file){
  const msg=$('impMsg');if(!file)return;
  try{await loadXLSX()}catch(e){msg.textContent=t('libFail');return}
  try{
    msg.textContent=t('reading');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    const rows=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):null;
    const rd=rows('দৈনিক খরচ'),rb=rows('ব্যাংক লেনদেন'),rm=rows('মাসিক হিসাব'),rs=rows('ব্যাংক সারাংশ');
    if(!rd&&!rb){msg.textContent=t('noSheet');return}
    const exp={},bank={};let ts=Date.now(),k=0;
    (rd||[]).slice(3).forEach(r=>{const d=isoOf(r[1]),a=num(r[3]);if(d&&a>0&&r[2])exp['i'+(k++)]={date:d,cat:String(r[2]).trim(),desc:String(r[4]||'').trim(),amount:a,method:String(r[5]||'Cash').trim(),ts:ts++}});
    (rb||[]).slice(3).forEach(r=>{const d=isoOf(r[1]),a=num(r[5]);if(d&&a>0&&r[2]&&r[3]){const ty=String(r[3]).includes(WD)?WD:DEP;bank['i'+(k++)]={date:d,bank:String(r[2]).trim(),type:ty,desc:String(r[4]||'').trim(),amount:a,income:ty===DEP&&String(r[6]||'')==='হ্যাঁ',ts:ts++}}});
    const set={currency:CUR(),cats:DEF_CATS.slice(),banks:[],income:{}};
    Object.values(exp).forEach(e=>{if(!set.cats.includes(e.cat))set.cats.push(e.cat)});
    for(const r of (rs||[]).slice(3)){const n=r[0]&&String(r[0]).trim();if(!n||n.includes('সর্বমোট')||n.includes('📊'))break;
      if(!set.banks.some(x=>x.name===n))set.banks.push({name:n,open:num(r[1])||0})}
    [...Object.values(exp).map(x=>x.method),...Object.values(bank).map(x=>x.bank)].forEach(n=>{if(n&&!set.banks.some(b=>b.name===n))set.banks.push({name:n,open:0})});
    if(!set.banks.length)set.banks=DEF_BANKS.map(n=>({name:n,open:0}));
    let yr=S.year;if(rm&&rm[2]&&num(rm[2][1])>2000)yr=num(rm[2][1]);
    (rm||[]).slice(5,17).forEach((r,i)=>{
      let s=num(r[1])||0,o=num(r[2])||0;const key=yr+'-'+pad(i+1);
      let auto=sum(Object.values(bank).filter(x=>mOf(x.date)===key&&isInc(x)).map(x=>x.amount));
      let t1=Math.min(s,auto);s-=t1;auto-=t1;t1=Math.min(o,auto);o-=t1;
      if(s||o)set.income[key]={salary:s,other:o};
    });
    D={settings:set,expenses:exp,bank};S.year=yr;persist();
    const m2=$('impMsg');if(m2)m2.textContent=t('impDone',Object.keys(exp).length,Object.keys(bank).length);
  }catch(e){msg.textContent=t('impFail',(e&&e.message)||'?')}
}

   ...bk.map((x,i)=>[i+1,x.date,x.bank,x.type,x.desc,x.amount,x.income?'হ্যাঁ':''])]);

  <div class="kpis"><div class="kpi"><small>${t('dep')}</small><b class="num">${M(dep)}</b></div><div class="kpi"><small>${t('wd')}</small><b class="num">${M(wd)}</b></div>
  <div class="kpi"><small>${t('exp')}</small><b class="num">${M(sum(banks.map(b=>b.spent)))}</b></div><div class="kpi"><small>${t('tot2')}</small><b class="num"${cls(bal)}>${M(bal)}</b></div></div>
  <h2>${t('accs')}</h2><div class="tw"><table class="num"><thead><tr><th>${t('thAc')}</th><th>${t('openB')}</th><th>${t('dep')}</th><th>${t('wd')}</th><th>${t('exp')}</th><th>${t('tot2')}</th></tr></thead><tbody>
  ${banks.map(b=>`<tr><td>${esc(b.name)}</td><td>${fmt(b.open)}</td><td>${fmt(b.dep)}</td><td>${fmt(b.wd)}</td><td>${fmt(b.spent)}</td><td${cls(b.bal)}>${fmt(b.bal)}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td>${t('total')}</td><td>${fmt(sum(banks.map(b=>b.open)))}</td><td>${fmt(dep)}</td><td>${fmt(wd)}</td><td>${fmt(sum(banks.map(b=>b.spent)))}</td><td>${fmt(bal)}</td></tr></tfoot></table></div>
  <h2>${t('txL')}</h2>${bk.length?`<table class="num lst"><thead><tr><th>${t('thD')}</th><th>${t('thAc')}</th><th>${t('thTy')}</th><th>${t('thDe')}</th><th>${t('thA')}</th></tr></thead><tbody>${bk.map(x=>`<tr><td>${dayLabel(x.date)}</td><td>${esc(x.bank)}</td><td>${typeLbl(x.type)}</td><td>${esc(x.desc)}</td><td${x.type===WD?' class="neg"':''}>${x.type===WD?'−':'+'}${fmt(x.amount)}</td></tr>`).join('')}</tbody></table>`:`<div class="sub">${t('none')}</div>`}
  <div class="foot">${esc(t('app'))}</div>`;
}
function reportHTML(kind){
  if(kind==='bank')return bankReportHTML();
  const month=kind==='month',key=S.month,yr=S.year;
  const inP=d=>month?mOf(d)===key:String(d).slice(0,4)==String(yr);
  const ex=S.exp.filter(e=>inP(e.date)).sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
  const bk=S.bank.filter(x=>inP(x.date)).sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
  const rows=Array.from({length:12},(_,i)=>({n:monthName(i),...monthStats(yr+'-'+pad(i+1))}));
  const T=k=>sum(rows.map(r=>r[k]));
  const ms=month?monthStats(key):null;
  const incT=month?ms.income:T('income'),expT=month?ms.total:T('total'),netT=incT-expT;
  const lastKey=[todayISO().slice(0,7),...S.exp.map(e=>mOf(e.date)),...S.bank.map(x=>mOf(x.date))].sort().pop();
  const by={};if(month)Object.assign(by,ms.by);else rows.forEach(r=>Object.entries(r.by).forEach(([c,v])=>by[c]=(by[c]||0)+v));
  const cats=Object.entries(by).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const banks=bankNames().map(bankStats),bal=month?balanceAt(key):sum(banks.map(b=>b.bal));
  const cls=v=>v<0?' class="neg"':'';
  const expTbl=ex.length?`<table class="num lst"><thead><tr><th>${t('thD')}</th><th>${t('thC')}</th><th>${t('thDe')}</th><th>${t('thAc')}</th><th>${t('thA')}</th></tr></thead><tbody>${ex.map(e=>`<tr><td>${dayLabel(e.date)}</td><td>${esc(e.cat)}</td><td>${esc(e.desc)}</td><td>${esc(e.method)}</td><td>${fmt(e.amount)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="4">${t('total')}</td><td>${fmt(expT)}</td></tr></tfoot></table>`:`<div class="sub">${t('none')}</div>`;
  const bkTbl=bk.length?`<table class="num lst"><thead><tr><th>${t('thD')}</th><th>${t('thAc')}</th><th>${t('thTy')}</th><th>${t('thDe')}</th><th>${t('thA')}</th></tr></thead><tbody>${bk.map(x=>`<tr><td>${dayLabel(x.date)}</td><td>${esc(x.bank)}</td><td>${typeLbl(x.type)}</td><td>${esc(x.desc)}</td><td${x.type===WD?' class="neg"':''}>${x.type===WD?'−':'+'}${fmt(x.amount)}</td></tr>`).join('')}</tbody></table>`:`<div class="sub">${t('none')}</div>`;
  const monthTbl=month?'':`<h2>${t('byMonth')}</h2><div class="tw"><table class="num"><thead><tr><th>${t('thM')}</th><th>${t('inc')}</th><th>${t('exp')}</th><th>${t('sur')}</th><th>${t('thEnd')}</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.n)}</td><td>${r.income?fmt(r.income):'–'}</td><td>${r.total?fmt(r.total):'–'}</td><td${cls(r.net)}>${r.income||r.total?fmt(r.net):'–'}</td><td>${(r.key<=lastKey&&r.key>=firstKey())?fmt(balanceAt(r.key)):'–'}</td></tr>`).join('')}
  </tbody><tfoot><tr><td>${t('total')}</td><td>${fmt(T('income'))}</td><td>${fmt(T('total'))}</td><td>${fmt(T('net'))}</td><td>${fmt(sum(banks.map(b=>b.bal)))}</td></tr></tfoot></table></div>`;
  return `<h1>${month?t('repM',monthLabel(key)):t('repY',yr)}</h1><div class="sub">${t('repSub',CUR()===SYM()?CUR():CUR()+' ('+esc(SYM())+')',dayLabel(todayISO()))}</div>
  <div class="kpis"><div class="kpi"><small>${t('inc')}</small><b class="num">${M(incT)}</b></div><div class="kpi"><small>${t('exp')}</small><b class="num">${M(expT)}</b></div>
  <div class="kpi"><small>${t('net')}</small><b class="num"${cls(netT)}>${M(netT)}</b></div><div class="kpi"><small>${month?t('thEnd'):t('curB')}</small><b class="num"${cls(bal)}>${M(bal)}</b></div></div>
  ${monthTbl}
  <div class="two"><div><h2>${t('byCat')}</h2><table class="num"><tbody>${cats.length?cats.map(c=>`<tr><td>${esc(c[0])}</td><td>${fmt(c[1])}</td><td>${Math.round(c[1]/expT*100)}%</td></tr>`).join(''):`<tr><td>${t('noExpY')}</td></tr>`}</tbody></table></div>
  <div><h2>${t('balAcc')}</h2><table class="num"><tbody>${banks.map(b=>`<tr><td>${esc(b.name)}</td><td${cls(b.bal)}>${fmt(b.bal)}</td></tr>`).join('')}</tbody></table></div></div>
  <h2>${t('expL')}</h2>${expTbl}<h2>${t('txL')}</h2>${bkTbl}
  <div class="foot">${esc(t('app'))}</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='tab'){S.tab=el.dataset.tab;try{localStorage.setItem('bdt_tab',S.tab)}catch(e){}render();window.scrollTo(0,0)}
  else if(a==='add')S.tab==='bank'?bankForm():expForm();
  else if(a==='editExp')expForm(S.exp.find(e=>e.id===id));
  else if(a==='editBank')bankForm(S.bank.find(e=>e.id===id));
  else if(a==='editInc')incForm(el.dataset.key);
  else if(a==='mPrev'){S.month=shiftMonth(S.month,-1);render()}
  else if(a==='mNext'){S.month=shiftMonth(S.month,1);render()}
  else if(a==='yPrev'){S.year--;render()}
  else if(a==='yNext'){S.year++;render()}
  else if(a==='banks')banksForm();
  else if(a==='cats')catsForm();
  else if(a==='export')exportXlsx();
  else if(a==='backup')backup();
  else if(a==='theme'){P.theme=id;savePrefs();applyTheme();render()}
  else if(a==='mode'){P.mode=id;savePrefs();applyTheme();render()}
  else if(a==='logo'){P.logo=id;savePrefs();render()}
  else if(a==='saveLogo')saveLogo();
  else if(a==='close')closeSheet();
  else if(a==='report')showReport(el.dataset.kind);
  else if(a==='rclose')$('report').hidden=true;
  else if(a==='rprint')printReport();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});
applyTheme();sync();render();
</script>
</body></html>
