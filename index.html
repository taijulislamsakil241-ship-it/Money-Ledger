/* ---------- calculations ---------- */
function bankStats(name){
  const cfg=D.settings.banks.find(b=>b.name===name);const open=+(cfg&&cfg.open)||0;
  const dep=sum(S.bank.filter(x=>x.bank===name&&x.type===DEP).map(x=>x.amount));
  const wd=sum(S.bank.filter(x=>x.bank===name&&x.type===WD).map(x=>x.amount));
  const spent=sum(S.exp.filter(e=>e.method===name).map(e=>e.amount));
  return {name,open,dep,wd,spent,bal:open+dep-wd-spent};
}
const totalBalance=()=>sum(bankNames().map(n=>bankStats(n).bal));
const isIncomeDesc=d=>INCOME_WORDS.some(w=>String(d||'').includes(w));
const isInc=x=>x.type===DEP&&(x.income||isIncomeDesc(x.desc));
function monthStats(key){
  const ex=S.exp.filter(e=>mOf(e.date)===key);
  const by={};ex.forEach(e=>{by[e.cat]=(by[e.cat]||0)+(+e.amount||0)});
  const total=sum(ex.map(e=>e.amount));
  const man=D.settings.income[key]||{};
  const auto=sum(S.bank.filter(x=>mOf(x.date)===key&&isInc(x)).map(x=>x.amount));
  const income=(+man.salary||0)+(+man.other||0)+auto;
  return {key,by,total,income,net:income-total,count:ex.length,auto};
}
const firstKey=()=>{const a=[...S.exp.map(e=>mOf(e.date)),...S.bank.map(x=>mOf(x.date))].sort();return a[0]||'0000-00'};
function balanceAt(key){
  const open=sum(D.settings.banks.map(b=>b.open));
  const dep=sum(S.bank.filter(x=>mOf(x.date)<=key&&x.type===DEP).map(x=>x.amount));
  const wd=sum(S.bank.filter(x=>mOf(x.date)<=key&&x.type===WD).map(x=>x.amount));
  const sp=sum(S.exp.filter(e=>mOf(e.date)<=key).map(e=>e.amount));
  return open+dep-wd-sp;
}

function openSheet(title,body,o){
  const el=$('sheet');
  el.innerHTML=`<div class="scrim" data-act="close"></div><form class="sheetpanel" id="sheetForm" autocomplete="off"><h2>${title}</h2>${body}<div class="err" id="sheetErr" hidden></div>
  <div class="row end">${o.onDelete?`<button type="button" class="btn danger" id="delBtn">${t('del')}</button>`:''}<button type="button" class="btn" data-act="close">${t('cancel')}</button><button type="submit" class="btn primary" id="saveBtn">${o.saveLabel||t('save')}</button></div></form>`;
  el.hidden=false;
  const form=$('sheetForm');
  form.onsubmit=ev=>{ev.preventDefault();
    try{const r=o.onSave(new FormData(form));if(r){const er=$('sheetErr');er.textContent=r;er.hidden=false;return}closeSheet()}
    catch(e){const er=$('sheetErr');er.textContent=t('sFail',(e&&e.message)||t('retry'));er.hidden=false}};
  {const sb=$('saveBtn');sb.addEventListener('click',ev=>{ev.preventDefault();if(!form.checkValidity()){form.reportValidity();return}form.onsubmit(ev)})}
  const d=$('delBtn');
  if(d)d.onclick=()=>{if(!d.dataset.sure){d.dataset.sure=1;d.textContent=t('sure');return}o.onDelete();closeSheet()};
  const first=form.querySelector('input[type=number]');if(first&&!o.noFocus)setTimeout(()=>first.focus(),50);
}

function download(name,blob){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

  catch(e){toast(t('fFail'))}

const readText=f=>f.text?f.text():new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f)});
function normalizeBackup(j){
  let d=j&&typeof j==='object'&&j.data&&typeof j.data==='object'?j.data:j;
  if(!d||typeof d!=='object')return null;
  const toObj=x=>Array.isArray(x)?Object.fromEntries(x.map((v,i)=>['r'+i,v])):(x&&typeof x==='object'?x:null);
  const ex=toObj(d.expenses),bk=toObj(d.bank);if(!ex||!bk)return null;
  const clean=o=>{const r={};for(const k in o){const v=o[k];if(v&&typeof v==='object'&&typeof v.date==='string'&&isFinite(+v.amount))r[k]=v}return r};
  const st=d.settings&&typeof d.settings==='object'?d.settings:{};
  const cats=Array.isArray(st.cats)&&st.cats.length?st.cats.map(String):DEF_CATS.slice();
  const banks=Array.isArray(st.banks)&&st.banks.length?st.banks.map(x=>typeof x==='string'?{name:x,open:0}:{name:String(x&&x.name||''),open:+(x&&x.open)||0}).filter(x=>x.name):DEF_BANKS.map(n=>({name:n,open:0}));
  return {settings:{currency:st.currency||'BDT',cats,banks,income:st.income&&typeof st.income==='object'?st.income:{}},expenses:clean(ex),bank:clean(bk)};
}

async function restoreFile(file){
  const inp=$('bkIn');if(!file)return;
  try{
    if(/\.xlsx?$/i.test(file.name)){await importXlsx(file)}
    else{const d=normalizeBackup(JSON.parse((await readText(file)).replace(/^\uFEFF/,'')));if(!d)throw 0;confirmRestore(d)}
  }catch(e){toast(t('rsBad'))}
  if(inp)inp.value='';
}

/* ---------- Excel ---------- */
const isoOf=v=>{
  if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()+12*3600e3).toISOString().slice(0,10);
  if(typeof v==='number'&&v>20000)return new Date(Math.round((v-25569)*86400e3)).toISOString().slice(0,10);
  if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
  return null;
};
async function importXlsx(file){
  const msg=$('impMsg');if(!file)return;
  try{await loadXLSX()}catch(e){msg.textContent=t('libFail');return}
  try{
    msg.textContent=t('reading');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    const rows=n=>wb.Sheets[n]?XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}):null;
    const rd=rows('দৈনিক খরচ'),rb=rows('ব্যাংক লেনদেন'),rm=rows('মাসিক হিসাব'),rs=rows('ব্যাংক সারাংশ');
    if(!rd&&!rb){msg.textContent=t('noSheet');return}
    const exp={},bank={};let ts=Date.now(),k=0;
    (rd||[]).slice(3).forEach(r=>{const d=isoOf(r[1]),a=num(r[3]);if(d&&a>0&&r[2])exp['i'+(k++)]={date:d,cat:String(r[2]).trim(),desc:String(r[4]||'').trim(),amount:a,method:String(r[5]||'Cash').trim(),ts:ts++}});
    (rb||[]).slice(3).forEach(r=>{const d=isoOf(r[1]),a=num(r[5]);if(d&&a>0&&r[2]&&r[3]){const ty=String(r[3]).includes(WD)?WD:DEP;bank['i'+(k++)]={date:d,bank:String(r[2]).trim(),type:ty,desc:String(r[4]||'').trim(),amount:a,income:ty===DEP&&String(r[6]||'')==='হ্যাঁ',ts:ts++}}});
    const set={currency:CUR(),cats:DEF_CATS.slice(),banks:[],income:{}};
    Object.values(exp).forEach(e=>{if(!set.cats.includes(e.cat))set.cats.push(e.cat)});
    for(const r of (rs||[]).slice(3)){const n=r[0]&&String(r[0]).trim();if(!n||n.includes('সর্বমোট')||n.includes('📊'))break;
      if(!set.banks.some(x=>x.name===n))set.banks.push({name:n,open:num(r[1])||0})}
    [...Object.values(exp).map(x=>x.method),...Object.values(bank).map(x=>x.bank)].forEach(n=>{if(n&&!set.banks.some(b=>b.name===n))set.banks.push({name:n,open:0})});
    if(!set.banks.length)set.banks=DEF_BANKS.map(n=>({name:n,open:0}));
    let yr=S.year;if(rm&&rm[2]&&num(rm[2][1])>2000)yr=num(rm[2][1]);
    (rm||[]).slice(5,17).forEach((r,i)=>{
      let s=num(r[1])||0,o=num(r[2])||0;const key=yr+'-'+pad(i+1);
      let auto=sum(Object.values(bank).filter(x=>mOf(x.date)===key&&isInc(x)).map(x=>x.amount));
      let t1=Math.min(s,auto);s-=t1;auto-=t1;t1=Math.min(o,auto);o-=t1;
      if(s||o)set.income[key]={salary:s,other:o};
    });
    D={settings:set,expenses:exp,bank};S.year=yr;persist();
    const m2=$('impMsg');if(m2)m2.textContent=t('impDone',Object.keys(exp).length,Object.keys(bank).length);
  }catch(e){msg.textContent=t('impFail',(e&&e.message)||'?')}
}
async function exportXlsx(){
  try{await loadXLSX()}catch(e){toast(t('libFail'));return}
  const C=CUR(),wb=XLSX.utils.book_new(),addSheet=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);
  const ex=S.exp.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
  const bk=S.bank.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
  const st=bankNames().map(bankStats),cats=catNames();
  const ms=Array.from({length:12},(_,i)=>monthStats(S.year+'-'+pad(i+1)));

function makePDF(jpgs,wpx,hpx){
  const enc=new TextEncoder(),parts=[],offs=[];let pos=0;
  const w=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);pos+=u.length};
  const PW=595.28,PH=841.89,n=jpgs.length,tot=3+n*3;
  const obj=(id,body)=>{offs[id]=pos;w(id+' 0 obj\n'+body+'\nendobj\n')};
  w('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${jpgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] /Count ${n} >>`);
  jpgs.forEach((j,i)=>{
    const p=3+i*3,c=p+1,im=p+2,cs=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${c} 0 R >>`);
    obj(c,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
    offs[im]=pos;w(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${wpx} /Height ${hpx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`);w(j);w('\nendstream\nendobj\n');
  });
  const xr=pos;let x=`xref\n0 ${tot}\n0000000000 65535 f \n`;
  for(let i=1;i<tot;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  w(x+`trailer\n<< /Size ${tot} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function reportPDF(kind,opts){
  const PW=794,PH=1123,MX=45,MY=38,CW=PW-2*MX,CH=PH-2*MY,SC=2;
  const css=paperCSS()+`.paper.pdfpg{width:${CW}px;max-width:none;margin:0;padding:0;box-shadow:none;border-radius:0;font-size:12px}`;
  const fr=document.createElement('iframe');
  fr.style.cssText=`position:fixed;left:-9999px;top:0;width:${CW}px;height:${PH}px;border:0;visibility:hidden`;
  document.body.appendChild(fr);
  try{
    const d=fr.contentWindow.document;d.open();
    d.write(`<!doctype html><html dir="${dirOf()}"><head><meta charset="utf-8"><style>${css}html,body{margin:0}body{font-family:${PFF}}</style></head><body><div class="paper pdfpg">${reportHTML(kind)}</div></body></html>`);d.close();
    await new Promise(r=>setTimeout(r,300));
    try{await d.fonts.ready}catch(e){}
    const el=d.querySelector('.pdfpg'),top=el.getBoundingClientRect().top,total=Math.ceil(el.scrollHeight);
    const cuts=[],add=y=>{if(y>0&&y<total)cuts.push(Math.round(y))};
    el.querySelectorAll('tr').forEach(tr=>{if(tr.closest('.two')||tr.closest('thead'))return;add(tr.getBoundingClientRect().bottom-top)});
    el.querySelectorAll('h2').forEach(x=>add(x.getBoundingClientRect().top-top));
    el.querySelectorAll('.kpis,.two').forEach(x=>add(x.getBoundingClientRect().bottom-top));
    const pages=[];let y0=0;
    while(y0<total-1){let y1=y0+CH;if(y1>=total)y1=total;else{let best=0;for(const c of cuts)if(c>y0+CH*.4&&c<=y1&&c>best)best=c;if(best)y1=best}pages.push([y0,y1]);y0=y1}
    const inner=new XMLSerializer().serializeToString(el);
    const cssX=(css+`body{font-family:${PFF}}`).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    const jpgs=[];
    for(const [a,b] of pages){
      const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${PW}" height="${PH}"><foreignObject x="0" y="0" width="${PW}" height="${PH}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${PW}px;height:${PH}px;background:#fff;position:relative;overflow:hidden;direction:${dirOf()};font-family:${PFF}"><style>${cssX}</style><div style="position:absolute;left:${MX}px;top:${MY}px;width:${CW}px;height:${Math.ceil(b-a)}px;overflow:hidden"><div style="position:absolute;left:0;top:${-a}px;width:${CW}px">${inner}</div></div></div></foreignObject></svg>`;
      const img=new Image();
      await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('img'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
      const cv=document.createElement('canvas');cv.width=PW*SC;cv.height=PH*SC;
      const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
      const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
      if(!blob)throw new Error('blob');
      jpgs.push(new Uint8Array(await blob.arrayBuffer()));
    }
    return opts&&opts.imgs?jpgs:makePDF(jpgs,PW*SC,PH*SC);
  }finally{fr.remove()}
}

  ${monthTbl}
  <div class="two"><div><h2>${t('byCat')}</h2><table class="num"><tbody>${cats.length?cats.map(c=>`<tr><td>${esc(c[0])}</td><td>${fmt(c[1])}</td><td>${Math.round(c[1]/expT*100)}%</td></tr>`).join(''):`<tr><td>${t('noExpY')}</td></tr>`}</tbody></table></div>
  <div><h2>${t('balAcc')}</h2><table class="num"><tbody>${banks.map(b=>`<tr><td>${esc(b.name)}</td><td${cls(b.bal)}>${fmt(b.bal)}</td></tr>`).join('')}</tbody></table></div></div>
  <h2>${t('expL')}</h2>${expTbl}<h2>${t('txL')}</h2>${bkTbl}
  <div class="foot">${esc(t('app'))}</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='tab'){S.tab=el.dataset.tab;try{localStorage.setItem('bdt_tab',S.tab)}catch(e){}render();window.scrollTo(0,0)}
  else if(a==='add')S.tab==='bank'?bankForm():expForm();
  else if(a==='editExp')expForm(S.exp.find(e=>e.id===id));
  else if(a==='editBank')bankForm(S.bank.find(e=>e.id===id));
  else if(a==='editInc')incForm(el.dataset.key);
  else if(a==='mPrev'){S.month=shiftMonth(S.month,-1);render()}
  else if(a==='mNext'){S.month=shiftMonth(S.month,1);render()}
  else if(a==='yPrev'){S.year--;render()}
  else if(a==='yNext'){S.year++;render()}
  else if(a==='banks')banksForm();
  else if(a==='cats')catsForm();
  else if(a==='export')exportXlsx();
  else if(a==='backup')backup();
  else if(a==='theme'){P.theme=id;savePrefs();applyTheme();render()}
  else if(a==='mode'){P.mode=id;savePrefs();applyTheme();render()}
  
  else if(a==='saveLogo')saveLogo();
  else if(a==='close')closeSheet();
  else if(a==='report')showReport(el.dataset.kind);
  else if(a==='rclose')$('report').hidden=true;
  else if(a==='rprint')printReport();
  else if(a==='rpdf')exportPDF(false);
  else if(a==='rchrome')openInChrome();
  else if(a==='rimg')showImages();
  else if(a==='iclose'){const v=$('imgview');if(v)v.hidden=true}
  else if(a==='rtext')shareReportText();
  else if(a==='rshare')exportPDF(true);
  else if(a==='pickBackup'){const f=$('bkIn');if(f)f.click()}
  else if(a==='pickXls'){const f=$('xlsIn');if(f)f.click()}
  else if(a==='copyBackup')copyBackup();
  else if(a==='pasteRestore')pasteForm();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden)closeSheet()});
applyTheme();sync();render();
requestAnimationFrame(()=>requestAnimationFrame(()=>{const b=$('boot');if(b){b.classList.add('off');setTimeout(()=>b.remove(),450)}}));
</script>
</body></html>
